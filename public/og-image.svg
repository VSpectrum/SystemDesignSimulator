<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#0f1123" />
      <stop offset="100%" stop-color="#181336" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#3b4263" opacity="0.45" />
    </pattern>

    <!-- Subtle Glow Gradient -->
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="accent-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0" />
    </radialGradient>

    <!-- Node Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#accent-glow)" />

  <!-- Top Left: Badge & Brand -->
  <g transform="translate(80, 75)">
    <!-- Brand Icon -->
    <rect width="56" height="56" rx="14" fill="#4f46e5" filter="url(#shadow)" />
    <!-- Mini diagram lines in logo -->
    <circle cx="20" cy="20" r="5" fill="#ffffff" />
    <circle cx="36" cy="20" r="4" fill="#a5b4fc" />
    <circle cx="36" cy="36" r="4.5" fill="#f59e0b" />
    <circle cx="20" cy="36" r="4" fill="#10b981" />
    <path d="M 20 20 L 36 20 L 36 36 L 20 36 Z" fill="none" stroke="#e0e7ff" stroke-width="2" stroke-dasharray="2,2" />
    <path d="M 20 20 L 36 36" fill="none" stroke="#ffffff" stroke-width="2" />

    <!-- Brand Name -->
    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-0.5">
      SysDesign <tspan fill="#818cf8">Sim</tspan>
    </text>
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" letter-spacing="1.5">
      EXCALIDRAW FOR DISTRIBUTED SYSTEMS
    </text>

    <!-- Headline -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="-1">
      Free System Design Tool &amp;
    </text>
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="800" font-size="44" fill="#c7d2fe" letter-spacing="-1">
      Whiteboard Architecture Simulator
    </text>

    <!-- Subtitle -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
      Sketch hand-drawn system diagrams, simulate live traffic &amp; RPS bottlenecks,
    </text>
    <text x="0" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
      and master FAANG system design interviews with 10 real-world architectures.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 285)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="190" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
      <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">
        ✏️ Excalidraw Aesthetic
      </text>

      <!-- Pill 2 -->
      <rect x="205" y="0" width="200" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
      <text x="220" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">
        ⚡ Live Traffic Simulator
      </text>

      <!-- Pill 3 -->
      <rect x="420" y="0" width="180" height="36" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
      <text x="435" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">
        🎯 10 Interview Kits
      </text>
    </g>
  </g>

  <!-- Right Side: Hand-Drawn Sketch Diagram Visual -->
  <g transform="translate(680, 80)">
    <!-- Canvas Frame -->
    <rect x="0" y="0" width="460" height="470" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" filter="url(#shadow)" />

    <!-- Canvas Header Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 444 0 Q 460 0 460 16 L 460 40 L 0 40 Z" fill="#202024" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#eab308" />
    <circle cx="52" cy="20" r="5" fill="#22c55e" />
    <text x="75" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">architecture_live_sim.sys</text>

    <!-- Metrics Bar in Canvas -->
    <rect x="240" y="10" width="205" height="22" rx="4" fill="#09090b" />
    <text x="250" y="25" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981" font-weight="600">● 12,450 RPS</text>
    <text x="350" y="25" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" font-weight="600">p99: 18ms</text>

    <!-- DIAGRAM NODES (Hand-Drawn Excalidraw Style) -->
    <!-- Node 1: Client Traffic -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="100" height="55" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2" stroke-dasharray="0" />
      <text x="50" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">Clients</text>
      <text x="50" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Web / iOS / Android</text>
    </g>

    <!-- Arrow 1: Clients -> Load Balancer -->
    <path d="M 130 108 L 190 108" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="4,3" />
    <polygon points="190,104 200,108 190,112" fill="#60a5fa" />

    <!-- Node 2: Cloud Load Balancer -->
    <g transform="translate(200, 75)">
      <rect x="0" y="0" width="110" height="65" rx="8" fill="#2d1f4e" stroke="#c084fc" stroke-width="2" />
      <text x="55" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#e9d5ff" text-anchor="middle">API Gateway</text>
      <text x="55" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">Load Balancer</text>
      <text x="55" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" text-anchor="middle">Healthy (0% err)</text>
    </g>

    <!-- Branch Arrows to Services -->
    <path d="M 310 100 L 350 80" stroke="#c084fc" stroke-width="2" />
    <polygon points="346,75 356,77 350,85" fill="#c084fc" />

    <path d="M 310 115 L 350 145" stroke="#c084fc" stroke-width="2" />
    <polygon points="350,140 356,148 346,150" fill="#c084fc" />

    <!-- Node 3: Microservice App Server -->
    <g transform="translate(345, 55)">
      <rect x="0" y="0" width="95" height="50" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <text x="47" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">API Cluster</text>
      <text x="47" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">4 Replicas</text>
    </g>

    <!-- Node 4: Async Worker -->
    <g transform="translate(345, 130)">
      <rect x="0" y="0" width="95" height="50" rx="8" fill="#713f12" stroke="#facc15" stroke-width="2" />
      <text x="47" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle">Kafka Queue</text>
      <text x="47" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a" text-anchor="middle">Events &amp; Tasks</text>
    </g>

    <!-- Arrow down to Cache & DB -->
    <path d="M 392 105 L 392 210 L 260 210" stroke="#34d399" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="265,206 255,210 265,214" fill="#34d399" />

    <!-- Node 5: Redis Cache -->
    <g transform="translate(145, 185)">
      <rect x="0" y="0" width="110" height="55" rx="8" fill="#831843" stroke="#f472b6" stroke-width="2" />
      <text x="55" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fbcfe8" text-anchor="middle">Redis Cache</text>
      <text x="55" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f472b6" text-anchor="middle">Hit Ratio: 94.2%</text>
    </g>

    <!-- Arrow to DB -->
    <path d="M 200 240 L 200 275" stroke="#f472b6" stroke-width="2" />
    <polygon points="196,275 200,285 204,275" fill="#f472b6" />

    <!-- Node 6: Distributed Database (PostgreSQL Shards) -->
    <g transform="translate(140, 285)">
      <rect x="0" y="0" width="130" height="65" rx="8" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2" />
      <text x="65" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#bae6fd" text-anchor="middle">Primary DB</text>
      <text x="65" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">PostgreSQL + Read Rep</text>
      <text x="65" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7dd3fc" text-anchor="middle">ACID / Multi-AZ</text>
    </g>

    <!-- Interactive Simulation Overlay Callout -->
    <g transform="translate(25, 370)">
      <rect x="0" y="0" width="410" height="80" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5" />
      <circle cx="20" cy="24" r="6" fill="#3b82f6" />
      <text x="35" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e5e7eb">
        Live Bottleneck Detection &amp; System Health
      </text>
      <text x="35" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">
        Throughput: 12.4k req/s • Latency p95: 14ms
      </text>
      <text x="35" y="66" font-family="-apple-system, sans-serif" font-size="10" fill="#10b981">
        ✓ No bottlenecks detected across 4 tiers
      </text>
    </g>
  </g>

  <!-- Bottom Bar: Free & Open Tool -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="14" fill="#64748b">
      100% Free &amp; Browser-Based • Zero Installation • Real-Time Collaboration • Verilog HDL Export
    </text>
  </g>
</svg>
