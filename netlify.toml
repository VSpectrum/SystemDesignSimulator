[build]
  command = "npm run build"
  publish = "dist"

# Single-Page App redirect: ensures direct link reloads or deep routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aggressive cache headers for Vite's immutable content-hashed bundles
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for Netlify Edge delivery
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
